<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Görev Takipçisi</title>
<style>
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --accent: #58a6ff;
    --accent2: #1f6feb;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --radius: 12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    overscroll-behavior-y: none;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  /* Header */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; background: var(--bg2);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    padding-top: calc(14px + var(--safe-top));
  }
  .header h1 { font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
  .header h1 svg { color: var(--accent); width: 22px; height: 22px; }

  /* Main Layout */
  .main-layout { display: grid; grid-template-columns: 260px 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 768px) { .main-layout { grid-template-columns: 1fr; } }

  /* Sidebar */
  .sidebar { display: flex; flex-direction: column; gap: 16px; }
  @media (max-width: 768px) { .sidebar { display: none; } }
  .panel {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }
  .panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--text2); margin-bottom: 12px; }

  .group-list { display: flex; flex-direction: column; gap: 4px; }
  .group-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    transition: background .15s; font-size: 14px;
  }
  .group-item:hover, .group-item:active { background: var(--bg3); }
  .group-item.active { background: var(--bg3); color: var(--accent); }
  .group-item .count {
    background: var(--bg3); padding: 2px 8px; border-radius: 10px;
    font-size: 12px; color: var(--text2);
  }
  .group-item.active .count { background: var(--accent2); color: #fff; }

  .group-add { display: flex; gap: 6px; margin-top: 8px; }
  .group-add input {
    flex: 1; background: var(--bg3); border: 1px solid var(--border);
    color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 14px;
  }
  .group-add input:focus { outline: none; border-color: var(--accent); }

  /* Search */
  .search-box { position: relative; }
  .search-box input {
    width: 100%; background: var(--bg3); border: 1px solid var(--border);
    color: var(--text); padding: 10px 12px 10px 38px; border-radius: var(--radius); font-size: 16px;
  }
  .search-box input:focus { outline: none; border-color: var(--accent); }
  .search-box svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--text2); width: 18px; height: 18px;
  }

  /* Stats */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat {
    background: var(--bg3); border-radius: 8px; padding: 12px; text-align: center;
  }
  .stat .num { font-size: 1.5rem; font-weight: 700; }
  .stat .lbl { font-size: 11px; color: var(--text2); text-transform: uppercase; margin-top: 2px; }

  /* Content */
  .content-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
  }
  .content-header h2 { font-size: 1.1rem; }

  /* Task Grid */
  .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  @media (max-width: 768px) { .task-grid { grid-template-columns: 1fr; } }

  /* Task Card */
  .task-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    transition: border-color .15s, transform .1s;
    display: flex; flex-direction: column;
  }
  .task-card:active { transform: scale(.98); }
  .task-card.done { opacity: .55; }
  .task-card.done .task-title { text-decoration: line-through; }

  .task-photo {
    width: 100%; height: 180px; object-fit: cover; cursor: pointer;
    border-bottom: 1px solid var(--border); display: block; background: var(--bg3);
  }
  .task-photo-placeholder {
    width: 100%; height: 90px; display: flex; align-items: center;
    justify-content: center; color: var(--text2); background: var(--bg3);
    border-bottom: 1px solid var(--border); font-size: 13px; gap: 8px;
  }
  .task-photo-placeholder svg { width: 20px; height: 20px; }

  .task-body { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .task-title { font-size: 15px; font-weight: 600; line-height: 1.4; }
  .task-note {
    font-size: 14px; color: var(--text2); line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
    max-height: 140px; overflow-y: auto;
  }
  .task-note::-webkit-scrollbar { width: 4px; }
  .task-note::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .task-meta {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 14px; border-top: 1px solid var(--border);
    background: rgba(0,0,0,.15);
  }
  .task-group-tag {
    font-size: 12px; padding: 3px 10px; border-radius: 12px;
    background: var(--bg3); color: var(--accent); cursor: pointer;
    border: 1px solid var(--border);
  }
  .task-date { font-size: 12px; color: var(--text2); margin-left: auto; }

  .task-actions {
    display: flex; gap: 8px; padding: 10px 14px;
    border-top: 1px solid var(--border);
  }
  .task-actions .btn { flex: 1; }

  /* Buttons */
  .btn {
    padding: 10px 18px; border: none; border-radius: var(--radius);
    cursor: pointer; font-size: 15px; font-weight: 500;
    transition: opacity .15s, transform .1s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(.96); }
  .btn-primary { background: var(--accent2); color: #fff; }
  .btn-success { background: #238636; color: #fff; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
  .btn-sm { padding: 8px 12px; font-size: 13px; }
  .btn-lg { padding: 14px 24px; font-size: 16px; }

  /* FAB (Floating Action Button) - Mobile */
  .fab {
    display: none;
    position: fixed; bottom: calc(20px + var(--safe-bottom)); right: 20px;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent2); color: #fff; border: none;
    font-size: 28px; line-height: 1; cursor: pointer;
    box-shadow: 0 4px 16px rgba(31,111,235,.4);
    z-index: 200; -webkit-tap-highlight-color: transparent;
  }
  @media (max-width: 768px) {
    .fab { display: flex; align-items: center; justify-content: center; }
    .add-task-header-btn { display: none; }
  }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 1000; padding: 0;
  }
  @media (min-width: 769px) {
    .modal-overlay { align-items: center; padding: 20px; }
  }
  .modal {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 16px 16px 0 0; width: 100%; max-width: 600px;
    max-height: 92vh; overflow-y: auto;
    animation: slideUp .25s ease;
  }
  @media (min-width: 769px) {
    .modal { border-radius: 16px; animation: fadeIn .2s ease; }
  }
  @keyframes slideUp { from { transform: translateY(100%); } }
  @keyframes fadeIn { from { opacity: 0; transform: scale(.95); } }

  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg2); z-index: 10;
  }
  .modal-header h3 { font-size: 1.1rem; }
  .modal-close {
    background: none; border: none; color: var(--text2); cursor: pointer;
    font-size: 28px; line-height: 1; width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
  }
  .modal-close:active { background: var(--bg3); }
  .modal-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; }
  .modal-body label { font-size: 14px; color: var(--text2); display: block; margin-bottom: 6px; }
  .modal-body input[type=text], .modal-body textarea, .modal-body select {
    width: 100%; background: var(--bg3); border: 1px solid var(--border);
    color: var(--text); padding: 12px 14px; border-radius: 10px; font-size: 16px;
    font-family: inherit;
  }
  .modal-body input:focus, .modal-body textarea:focus, .modal-body select:focus {
    outline: none; border-color: var(--accent);
  }
  .modal-body textarea { resize: vertical; min-height: 90px; }

  .photo-drop-zone {
    border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 28px; text-align: center; cursor: pointer;
    transition: border-color .15s; color: var(--text2);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .photo-drop-zone:active { border-color: var(--accent); }
  .photo-drop-zone svg { width: 36px; height: 36px; }
  .photo-drop-zone span { font-size: 14px; }
  .photo-preview {
    margin-top: 12px; position: relative; display: inline-block;
  }
  .photo-preview img { max-width: 220px; max-height: 160px; border-radius: 10px; border: 1px solid var(--border); }
  .photo-remove {
    position: absolute; top: -10px; right: -10px; width: 28px; height: 28px;
    border-radius: 50%; background: var(--red); color: #fff; border: none;
    cursor: pointer; font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }

  .modal-footer {
    padding: 14px 22px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 10px;
    position: sticky; bottom: 0; background: var(--bg2);
    padding-bottom: calc(14px + var(--safe-bottom));
  }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.95);
    display: flex; align-items: center; justify-content: center;
    z-index: 2000; cursor: zoom-out; padding: 20px;
  }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; }

  /* Toast */
  .toast-container {
    position: fixed; top: calc(70px + var(--safe-top)); right: 20px;
    z-index: 3000; display: flex; flex-direction: column; gap: 8px;
    left: 20px; right: 20px;
  }
  .toast {
    padding: 12px 18px; border-radius: var(--radius); font-size: 15px;
    animation: slideIn .3s ease, fadeOut .3s ease 2.7s forwards;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
  }
  .toast-success { background: #238636; color: #fff; }
  .toast-error { background: var(--red); color: #fff; }
  .toast-info { background: var(--accent2); color: #fff; }
  @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } }
  @keyframes fadeOut { to { transform: translateY(-20px); opacity: 0; } }

  /* Empty State */
  .empty-state {
    text-align: center; padding: 80px 20px; color: var(--text2);
  }
  .empty-state svg { width: 80px; height: 80px; margin-bottom: 20px; opacity: .4; }
  .empty-state h3 { font-size: 1.2rem; margin-bottom: 10px; }
  .empty-state p { font-size: 15px; line-height: 1.5; }

  /* Bottom Sheet for Groups on Mobile */
  .bottom-sheet-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    z-index: 900; display: none;
  }
  .bottom-sheet-overlay.open { display: block; }
  .bottom-sheet {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg2); border-radius: 16px 16px 0 0;
    padding: 20px; z-index: 901;
    padding-bottom: calc(20px + var(--safe-bottom));
    transform: translateY(100%); transition: transform .25s ease;
    max-height: 70vh; overflow-y: auto;
  }
  .bottom-sheet.open { transform: translateY(0); }
  .bottom-sheet-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .bottom-sheet-header h3 { font-size: 1.1rem; }
  .bottom-sheet-close {
    background: none; border: none; color: var(--text2); font-size: 24px; cursor: pointer;
  }

  /* Mobile group list in bottom sheet */
  .mobile-group-list { display: flex; flex-direction: column; gap: 4px; }

  /* Tab bar for mobile bottom nav */
  .mobile-tabbar {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg2); border-top: 1px solid var(--border);
    padding-bottom: var(--safe-bottom);
    z-index: 100;
  }
  @media (max-width: 768px) {
    .mobile-tabbar { display: flex; }
    .container { padding-bottom: 80px; }
  }
  .tabbar-items {
    display: flex; flex: 1;
  }
  .tabbar-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 0; background: none; border: none; color: var(--text2);
    font-size: 11px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .tabbar-btn.active { color: var(--accent); }
  .tabbar-btn svg { width: 22px; height: 22px; }
</style>
</head>
<body>

<div class="toast-container" id="toasts"></div>

<div class="header">
  <h1>
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-2 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-2 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z"/></svg>
    Görev Takipçisi
  </h1>
  <button class="btn btn-secondary btn-sm" id="menuBtn" style="display:none;">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75ZM1.75 12h12.5a.75.75 0 0 1 0 1.5H1.75a.75.75 0 0 1 0-1.5Z"/></svg>
  </button>
</div>

<div class="container">
  <div class="main-layout">
    <aside class="sidebar" id="sidebar">
      <div class="panel">
        <h3>Gruplar</h3>
        <div class="group-list" id="groupList"></div>
        <div class="group-add">
          <input type="text" id="newGroupInput" placeholder="Yeni grup adı..." maxlength="30">
          <button class="btn btn-primary btn-sm" id="addGroupBtn">Ekle</button>
        </div>
      </div>

      <div class="panel">
        <h3>Ara</h3>
        <div class="search-box">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>
          <input type="text" id="searchInput" placeholder="Görevlerde ara...">
        </div>
      </div>

      <div class="panel">
        <h3>İstatistikler</h3>
        <div class="stats">
          <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Toplam</div></div>
          <div class="stat"><div class="num" id="statDone" style="color:var(--green);">0</div><div class="lbl">Tamam</div></div>
          <div class="stat"><div class="num" id="statPending" style="color:var(--yellow);">0</div><div class="lbl">Bekliyor</div></div>
          <div class="stat"><div class="num" id="statGroups" style="color:var(--accent);">0</div><div class="lbl">Grup</div></div>
        </div>
      </div>
    </aside>

    <main>
      <div class="content-header">
        <h2 id="currentViewTitle">Tüm Görevler</h2>
        <button class="btn btn-primary add-task-header-btn" id="addTaskBtn">+ Görev Ekle</button>
      </div>
      <div class="task-grid" id="taskGrid"></div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm5-2.25A.75.75 0 0 1 5.75 5h4.5a.75.75 0 0 1 0 1.5h-4.5A.75.75 0 0 1 5 5.75zm0 3A.75.75 0 0 1 5.75 8h4.5a.75.75 0 0 1 0 1.5h-4.5A.75.75 0 0 1 5 8.75z"/></svg>
        <h3>Henüz görev yok</h3>
        <p>Aşağıdaki + butonuna dokunarak<br>ilk görevini ekleyebilirsin</p>
      </div>
    </main>
  </div>
</div>

<!-- FAB for mobile -->
<button class="fab" id="fabBtn" aria-label="Görev ekle">+</button>

<!-- Mobile Bottom Tab Bar -->
<div class="mobile-tabbar">
  <div class="tabbar-items">
    <button class="tabbar-btn active" data-tab="all" id="tabAll">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75ZM1.75 12h12.5a.75.75 0 0 1 0 1.5H1.75a.75.75 0 0 1 0-1.5Z"/></svg>
      Tümü
    </button>
    <button class="tabbar-btn" data-tab="pending" id="tabPending">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm9.78-2.22a.75.75 0 0 0-1.06-1.06L6.75 6.69 5.28 5.22a.75.75 0 0 0-1.06 1.06l2 2a.75.75 0 0 0 1.06 0l2.5-2.5z"/></svg>
      Bekleyen
    </button>
    <button class="tabbar-btn" data-tab="done" id="tabDone">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.75.75 0 0 1 1.06-1.06L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0z"/></svg>
      Tamam
    </button>
    <button class="tabbar-btn" data-tab="groups" id="tabGroups">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.75 2.5a.75.75 0 0 0 0 1.5h12.5a.75.75 0 0 0 0-1.5H1.75Zm0 3a.75.75 0 0 0 0 1.5h8a.75.75 0 0 0 0-1.5h-8Zm0 3a.75.75 0 0 0 0 1.5h4a.75.75 0 0 0 0-1.5h-4Zm0 3a.75.75 0 0 0 0 1.5h2a.75.75 0 0 0 0-1.5h-2Z"/></svg>
      Gruplar
    </button>
  </div>
</div>

<!-- Bottom Sheet for Mobile Groups -->
<div class="bottom-sheet-overlay" id="bottomSheetOverlay"></div>
<div class="bottom-sheet" id="bottomSheet">
  <div class="bottom-sheet-header">
    <h3>Gruplar</h3>
    <button class="bottom-sheet-close" id="bottomSheetClose">&times;</button>
  </div>
  <div class="mobile-group-list" id="mobileGroupList"></div>
  <div class="group-add" style="margin-top:12px;">
    <input type="text" id="mobileNewGroupInput" placeholder="Yeni grup adı..." maxlength="30">
    <button class="btn btn-primary btn-sm" id="mobileAddGroupBtn">Ekle</button>
  </div>
</div>

<!-- Task Modal -->
<div class="modal-overlay" id="taskModal" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Görev Ekle</h3>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body">
      <div>
        <label>Başlık *</label>
        <input type="text" id="taskTitle" placeholder="Görev başlığı..." maxlength="100">
      </div>
      <div>
        <label>Not</label>
        <textarea id="taskNote" placeholder="Detaylı not..."></textarea>
      </div>
      <div>
        <label>Grup</label>
        <select id="taskGroup"></select>
      </div>
      <div>
        <label>Fotoğraf</label>
        <div class="photo-drop-zone" id="dropZone">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4.502 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/><path d="M14.002 13a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2V5A2 2 0 0 1 4 3h8a2 2 0 0 1 2 2v8z"/><path d="M14.002 13a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2V5A2 2 0 0 1 4 3h8a2 2 0 0 1 2 2v8z" opacity=".5"/></svg>
          <span>Fotoğraf seç veya sürükle</span>
          <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;">
        </div>
        <div class="photo-preview" id="photoPreview" style="display:none;">
          <img id="photoPreviewImg" src="" alt="Önizleme">
          <button class="photo-remove" id="photoRemove">&times;</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modalCancel">İptal</button>
      <button class="btn btn-success" id="modalSave">Kaydet</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" style="display:none;">
  <img id="lightboxImg" src="" alt="Fotoğraf">
</div>

<script>
// ====== State ======
const STORAGE_KEY = 'task_tracker_data_v1';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      return {
        tasks: data.tasks || [],
        groups: data.groups || ['Genel'],
      };
    }
  } catch(e) {}
  return { tasks: [], groups: ['Genel'] };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    tasks: state.tasks,
    groups: state.groups,
  }));
}

let state = loadState();
let activeGroup = 'all';
let activeTab = 'all';
let searchQuery = '';
let editingTaskId = null;
let pendingPhotoBase64 = '';

// ====== DOM Refs ======
const $ = id => document.getElementById(id);
const els = {
  menuBtn: $('menuBtn'),
  sidebar: $('sidebar'),
  groupList: $('groupList'),
  newGroupInput: $('newGroupInput'),
  addGroupBtn: $('addGroupBtn'),
  searchInput: $('searchInput'),
  taskGrid: $('taskGrid'),
  emptyState: $('emptyState'),
  currentViewTitle: $('currentViewTitle'),
  addTaskBtn: $('addTaskBtn'),
  fabBtn: $('fabBtn'),
  statTotal: $('statTotal'),
  statDone: $('statDone'),
  statPending: $('statPending'),
  statGroups: $('statGroups'),
  taskModal: $('taskModal'),
  modalTitle: $('modalTitle'),
  modalClose: $('modalClose'),
  modalCancel: $('modalCancel'),
  modalSave: $('modalSave'),
  taskTitle: $('taskTitle'),
  taskNote: $('taskNote'),
  taskGroup: $('taskGroup'),
  dropZone: $('dropZone'),
  photoInput: $('photoInput'),
  photoPreview: $('photoPreview'),
  photoPreviewImg: $('photoPreviewImg'),
  photoRemove: $('photoRemove'),
  lightbox: $('lightbox'),
  lightboxImg: $('lightboxImg'),
  toasts: $('toasts'),
  bottomSheet: $('bottomSheet'),
  bottomSheetOverlay: $('bottomSheetOverlay'),
  bottomSheetClose: $('bottomSheetClose'),
  mobileGroupList: $('mobileGroupList'),
  mobileNewGroupInput: $('mobileNewGroupInput'),
  mobileAddGroupBtn: $('mobileAddGroupBtn'),
};

// ====== Toast ======
function showToast(message, type = 'info') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = message;
  els.toasts.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ====== Photo Handling ======
function compressImage(file, maxWidth = 1200, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePhotoFile(file) {
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    showToast('Lütfen bir görsel dosyası seçin', 'error');
    return;
  }
  try {
    const base64 = await compressImage(file);
    pendingPhotoBase64 = base64;
    els.photoPreviewImg.src = base64;
    els.photoPreview.style.display = 'inline-block';
  } catch (e) {
    showToast('Fotoğraf işlenemedi', 'error');
  }
}

// ====== Rendering ======
function renderGroups() {
  const counts = { all: state.tasks.length, pending: state.tasks.filter(t=>!t.done).length, done: state.tasks.filter(t=>t.done).length };
  state.tasks.forEach(t => { counts[t.group] = (counts[t.group] || 0) + 1; });

  let html = `<div class="group-item ${activeGroup === 'all' ? 'active' : ''}" data-group="all">
    <span>Tümü</span><span class="count">${counts.all || 0}</span>
  </div>`;

  state.groups.forEach(g => {
    html += `<div class="group-item ${activeGroup === g ? 'active' : ''}" data-group="${escapeHtml(g)}">
      <span>${escapeHtml(g)}</span><span class="count">${counts[g] || 0}</span>
    </div>`;
  });

  els.groupList.innerHTML = html;
  els.groupList.querySelectorAll('.group-item').forEach(el => {
    el.onclick = () => { activeGroup = el.dataset.group; render(); };
  });

  // Mobile bottom sheet group list
  let mobileHtml = '';
  state.groups.forEach(g => {
    mobileHtml += `<div class="group-item ${activeGroup === g ? 'active' : ''}" data-group="${escapeHtml(g)}">
      <span>${escapeHtml(g)}</span><span class="count">${counts[g] || 0}</span>
    </div>`;
  });
  els.mobileGroupList.innerHTML = mobileHtml;
  els.mobileGroupList.querySelectorAll('.group-item').forEach(el => {
    el.onclick = () => { activeGroup = el.dataset.group; closeBottomSheet(); render(); };
  });
}

function renderStats() {
  els.statTotal.textContent = state.tasks.length;
  els.statDone.textContent = state.tasks.filter(t => t.done).length;
  els.statPending.textContent = state.tasks.filter(t => !t.done).length;
  els.statGroups.textContent = state.groups.length;
}

function getFilteredTasks() {
  let tasks = state.tasks;
  if (activeTab === 'pending') tasks = tasks.filter(t => !t.done);
  else if (activeTab === 'done') tasks = tasks.filter(t => t.done);
  else if (activeGroup !== 'all') tasks = tasks.filter(t => t.group === activeGroup);

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    tasks = tasks.filter(t =>
      t.title.toLowerCase().includes(q) ||
      (t.note && t.note.toLowerCase().includes(q)) ||
      (t.group && t.group.toLowerCase().includes(q))
    );
  }
  return tasks.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
}

function renderTasks() {
  const tasks = getFilteredTasks();
  if (tasks.length === 0) {
    els.taskGrid.style.display = 'none';
    els.emptyState.style.display = 'block';
    return;
  }
  els.emptyState.style.display = 'none';
  els.taskGrid.style.display = 'grid';

  els.taskGrid.innerHTML = tasks.map(t => `
    <div class="task-card ${t.done ? 'done' : ''}" data-id="${t.id}">
      ${t.photo
        ? `<img class="task-photo" src="${t.photo}" alt="" onclick="openLightbox('${t.id}')">`
        : `<div class="task-photo-placeholder">
            <svg viewBox="0 0 16 16" fill="currentColor"><path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/><path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z"/></svg>
            Fotoğraf yok
           </div>`
      }
      <div class="task-body">
        <div class="task-title">${escapeHtml(t.title)}</div>
        ${t.note ? `<div class="task-note">${escapeHtml(t.note)}</div>` : ''}
      </div>
      <div class="task-meta">
        <span class="task-group-tag" onclick="filterByGroup('${escapeHtml(t.group)}')">${escapeHtml(t.group)}</span>
        <span class="task-date">${formatDate(t.created_at)}</span>
      </div>
      <div class="task-actions">
        <button class="btn btn-sm ${t.done ? 'btn-secondary' : 'btn-success'}" onclick="toggleDone('${t.id}')">
          ${t.done ? 'Geri Al' : 'Tamamla'}
        </button>
        <button class="btn btn-sm btn-secondary" onclick="editTask('${t.id}')">Düzenle</button>
        <button class="btn btn-sm btn-danger" onclick="deleteTask('${t.id}')">Sil</button>
      </div>
    </div>
  `).join('');
}

function renderGroupSelect() {
  els.taskGroup.innerHTML = state.groups.map(g =>
    `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`
  ).join('');
}

function renderTitle() {
  if (searchQuery) {
    els.currentViewTitle.textContent = `"${searchQuery}" araması`;
  } else if (activeTab === 'pending') {
    els.currentViewTitle.textContent = 'Bekleyen Görevler';
  } else if (activeTab === 'done') {
    els.currentViewTitle.textContent = 'Tamamlanan Görevler';
  } else if (activeGroup === 'all') {
    els.currentViewTitle.textContent = 'Tüm Görevler';
  } else {
    els.currentViewTitle.textContent = activeGroup;
  }
}

function renderTabs() {
  document.querySelectorAll('.tabbar-btn').forEach(b => b.classList.remove('active'));
  const tabMap = { all: 'tabAll', pending: 'tabPending', done: 'tabDone', groups: 'tabGroups' };
  if (activeTab && tabMap[activeTab]) $(tabMap[activeTab]).classList.add('active');
}

function render() {
  renderGroups();
  renderStats();
  renderTasks();
  renderTitle();
  renderTabs();
}

// ====== Helpers ======
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return 'Az önce';
  if (diff < 3600) return Math.floor(diff / 60) + ' dk önce';
  if (diff < 86400) return Math.floor(diff / 3600) + ' saat önce';
  if (diff < 604800) return Math.floor(diff / 86400) + ' gün önce';
  return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
}

// ====== Actions ======
window.filterByGroup = function(group) {
  activeGroup = group;
  activeTab = 'all';
  render();
};

window.openLightbox = function(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if (task && task.photo) {
    els.lightboxImg.src = task.photo;
    els.lightbox.style.display = 'flex';
  }
};

window.toggleDone = function(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  task.done = !task.done;
  task.updated_at = new Date().toISOString();
  saveState();
  render();
  showToast(task.done ? 'Görev tamamlandi' : 'Görev geri alindi', 'success');
};

window.editTask = function(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  editingTaskId = taskId;
  els.modalTitle.textContent = 'Görevi Düzenle';
  els.taskTitle.value = task.title;
  els.taskNote.value = task.note || '';
  pendingPhotoBase64 = task.photo || '';
  renderGroupSelect();
  els.taskGroup.value = task.group || 'Genel';
  if (task.photo) {
    els.photoPreviewImg.src = task.photo;
    els.photoPreview.style.display = 'inline-block';
  } else {
    els.photoPreview.style.display = 'none';
  }
  els.taskModal.style.display = 'flex';
};

window.deleteTask = function(taskId) {
  if (!confirm('Bu görevi silmek istediğinize emin misiniz?')) return;
  state.tasks = state.tasks.filter(t => t.id !== taskId);
  saveState();
  render();
  showToast('Görev silindi', 'success');
};

function saveTask() {
  const title = els.taskTitle.value.trim();
  if (!title) { showToast('Başlık gerekli', 'error'); return; }

  const note = els.taskNote.value.trim();
  const group = els.taskGroup.value || 'Genel';

  if (!state.groups.includes(group)) {
    state.groups.push(group);
  }

  if (editingTaskId) {
    const task = state.tasks.find(t => t.id === editingTaskId);
    if (task) {
      task.title = title;
      task.note = note;
      task.group = group;
      task.photo = pendingPhotoBase64;
      task.updated_at = new Date().toISOString();
    }
    showToast('Görev güncellendi', 'success');
  } else {
    state.tasks.push({
      id: generateId(),
      title, note, group,
      photo: pendingPhotoBase64,
      done: false,
      created_at: new Date().toISOString(),
      updated_at: new Date().toISOString(),
    });
    showToast('Görev eklendi', 'success');
  }

  saveState();
  closeModal();
  render();
}

function closeModal() {
  els.taskModal.style.display = 'none';
  editingTaskId = null;
  pendingPhotoBase64 = '';
  els.taskTitle.value = '';
  els.taskNote.value = '';
  els.photoPreview.style.display = 'none';
}

// ====== Bottom Sheet ======
function openBottomSheet() {
  els.bottomSheetOverlay.classList.add('open');
  els.bottomSheet.classList.add('open');
}
function closeBottomSheet() {
  els.bottomSheetOverlay.classList.remove('open');
  els.bottomSheet.classList.remove('open');
}

// ====== Event Listeners ======
els.addGroupBtn.onclick = () => {
  const name = els.newGroupInput.value.trim();
  if (!name) return;
  if (state.groups.includes(name)) { showToast('Bu grup zaten var', 'error'); return; }
  state.groups.push(name);
  els.newGroupInput.value = '';
  saveState();
  render();
  showToast('Grup eklendi: ' + name, 'success');
};

els.newGroupInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') els.addGroupBtn.click();
});

els.mobileAddGroupBtn.onclick = () => {
  const name = els.mobileNewGroupInput.value.trim();
  if (!name) return;
  if (state.groups.includes(name)) { showToast('Bu grup zaten var', 'error'); return; }
  state.groups.push(name);
  els.mobileNewGroupInput.value = '';
  saveState();
  render();
  showToast('Grup eklendi: ' + name, 'success');
};

els.mobileNewGroupInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') els.mobileAddGroupBtn.click();
});

els.searchInput.addEventListener('input', () => {
  searchQuery = els.searchInput.value.trim();
  renderTasks();
  renderTitle();
});

els.addTaskBtn.onclick = () => openTaskModal();
els.fabBtn.onclick = () => openTaskModal();

function openTaskModal() {
  editingTaskId = null;
  els.modalTitle.textContent = 'Görev Ekle';
  els.taskTitle.value = '';
  els.taskNote.value = '';
  pendingPhotoBase64 = '';
  els.photoPreview.style.display = 'none';
  renderGroupSelect();
  els.taskModal.style.display = 'flex';
}

els.modalClose.onclick = closeModal;
els.modalCancel.onclick = closeModal;
els.modalSave.onclick = saveTask;

els.taskModal.addEventListener('click', e => {
  if (e.target === els.taskModal) closeModal();
});

els.dropZone.onclick = () => els.photoInput.click();
els.photoInput.onchange = e => handlePhotoFile(e.target.files[0]);
els.photoRemove.onclick = () => {
  pendingPhotoBase64 = '';
  els.photoPreview.style.display = 'none';
  els.photoInput.value = '';
};

// Drag & drop (desktop)
els.dropZone.addEventListener('dragover', e => { e.preventDefault(); els.dropZone.style.borderColor = 'var(--accent)'; });
els.dropZone.addEventListener('dragleave', () => { els.dropZone.style.borderColor = ''; });
els.dropZone.addEventListener('drop', e => {
  e.preventDefault();
  els.dropZone.style.borderColor = '';
  const file = e.dataTransfer.files[0];
  if (file) handlePhotoFile(file);
});

// Lightbox
els.lightbox.onclick = () => { els.lightbox.style.display = 'none'; };

// Bottom sheet
els.bottomSheetOverlay.onclick = closeBottomSheet;
els.bottomSheetClose.onclick = closeBottomSheet;

// Mobile tab bar
document.querySelectorAll('.tabbar-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    if (tab === 'groups') {
      openBottomSheet();
      return;
    }
    activeTab = tab;
    activeGroup = 'all';
    render();
  });
});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal();
    els.lightbox.style.display = 'none';
    closeBottomSheet();
  }
});

// ====== Init ======
render();
</script>
</body>
</html>
